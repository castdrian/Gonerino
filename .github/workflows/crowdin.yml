name: Crowdin translations

on:
  push:
    branches:
      - main
    paths:
      - "layout/Library/Application Support/Gonerino.bundle/en.lproj/Localizable.strings"
      - crowdin.yml
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin-translations
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crowdin/github-action@v3
        with:
          upload_sources: true
          upload_translations: true
          download_translations: true
          skip_untranslated_strings: true
          push_sources: false
          push_translations: true
          crowdin_branch_name: main
          localization_branch_name: l10n_crowdin_translations
          commit_message: "chore(i18n): sync Crowdin translations"
          create_pull_request: true
          pull_request_title: "chore(i18n): sync Crowdin translations"
          pull_request_body: "Automated submitted translations from Crowdin."
          pull_request_labels: "localization,automated"
          pull_request_base_branch_name: main
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

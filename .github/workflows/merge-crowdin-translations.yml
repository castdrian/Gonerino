name: Merge Crowdin translations

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'l10n_main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate changed files
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          source_file="layout/Library/Application Support/Gonerino.bundle/en.lproj/Localizable.strings"
          files=$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')
          test -n "$files"
          while IFS= read -r file; do
            case "$file" in
              "layout/Library/Application Support/Gonerino.bundle/de.lproj/Localizable.strings" | \
              "layout/Library/Application Support/Gonerino.bundle/es.lproj/Localizable.strings" | \
              "layout/Library/Application Support/Gonerino.bundle/tr.lproj/Localizable.strings")
                test -f "$file"
                if cmp -s "$source_file" "$file"; then
                  exit 1
                fi
                ;;
              *) exit 1 ;;
            esac
          done <<< "$files"
      - name: Enable automatic merge
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --squash --auto --delete-branch

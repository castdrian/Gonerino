<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 820" role="img" aria-labelledby="title description">
  <title id="title">Gonerino screenshots</title>
  <desc id="description">Gonerino custom settings, long-form blocking actions, and Shorts blocking actions shown in Apple-style device frames.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151922"/>
      <stop offset="1" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#454b58"/>
      <stop offset="0.48" stop-color="#161922"/>
      <stop offset="1" stop-color="#050609"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <clipPath id="screen-settings"><rect x="56" y="132" width="338" height="601" rx="34"/></clipPath>
    <clipPath id="screen-long"><rect x="551" y="132" width="338" height="601" rx="34"/></clipPath>
    <clipPath id="screen-shorts"><rect x="1046" y="132" width="338" height="601" rx="34"/></clipPath>
  </defs>
  <rect width="1440" height="820" fill="url(#background)"/>
  <circle cx="1160" cy="28" r="190" fill="#5d6eff" opacity="0.08"/>
  <circle cx="210" cy="770" r="210" fill="#e22955" opacity="0.08"/>
  <g fill="#f7f8fb" font-family="Arial" text-anchor="middle">
    <text x="225" y="65" font-size="27" font-weight="700">Custom settings</text>
    <text x="720" y="65" font-size="27" font-weight="700">Long-form controls</text>
    <text x="1215" y="65" font-size="27" font-weight="700">Shorts controls</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="28" y="96" width="394" height="680" rx="58" fill="url(#frame)" stroke="#707888" stroke-opacity="0.42" stroke-width="2"/>
    <rect x="523" y="96" width="394" height="680" rx="58" fill="url(#frame)" stroke="#707888" stroke-opacity="0.42" stroke-width="2"/>
    <rect x="1018" y="96" width="394" height="680" rx="58" fill="url(#frame)" stroke="#707888" stroke-opacity="0.42" stroke-width="2"/>
  </g>
  <g fill="#030406">
    <rect x="178" y="110" width="94" height="18" rx="9"/>
    <rect x="673" y="110" width="94" height="18" rx="9"/>
    <rect x="1168" y="110" width="94" height="18" rx="9"/>
  </g>
  <g stroke="#15171d" stroke-width="7" stroke-linecap="round">
    <path d="M40 252h0"/><path d="M40 292h0"/>
    <path d="M535 252h0"/><path d="M535 292h0"/>
    <path d="M1030 252h0"/><path d="M1030 292h0"/>
  </g>
  <g>
    <rect x="56" y="132" width="338" height="601" rx="34" fill="#08090b"/>
    <rect x="551" y="132" width="338" height="601" rx="34" fill="#08090b"/>
    <rect x="1046" y="132" width="338" height="601" rx="34" fill="#08090b"/>
    <image x="56" y="132" width="338" height="601" preserveAspectRatio="xMidYMid slice" clip-path="url(#screen-settings)" xlink:href="settings.png"/>
    <image x="551" y="132" width="338" height="601" preserveAspectRatio="xMidYMid slice" clip-path="url(#screen-long)" xlink:href="long-form-menu.png"/>
    <image x="1046" y="132" width="338" height="601" preserveAspectRatio="xMidYMid slice" clip-path="url(#screen-shorts)" xlink:href="shorts-menu.png"/>
  </g>
  <g fill="#090a0d">
    <circle cx="225" cy="754" r="17" stroke="#5d626c" stroke-width="2"/>
    <circle cx="720" cy="754" r="17" stroke="#5d626c" stroke-width="2"/>
    <circle cx="1215" cy="754" r="17" stroke="#5d626c" stroke-width="2"/>
  </g>
</svg>
